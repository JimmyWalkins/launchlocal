<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LaunchLocal — Assistant</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fff; color: #1c1c1c; display: flex; flex-direction: column; height: 100vh; }
      header { padding: 12px 16px; background: #ff7000; color: #fff; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
      header a { color: #fff; font-size: 12px; text-decoration: underline; }
      #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.45; font-size: 14.5px; }
      .user { align-self: flex-end; background: #ff7000; color: #fff; border-bottom-right-radius: 3px; }
      .assistant { align-self: flex-start; background: #f7f4ef; border: 1px solid #e4ddd2; border-bottom-left-radius: 3px; }
      .msg.error { align-self: center; background: #fdeaea; border: 1px solid #f2b8b5; color: #86231f; }
      .msg a { color: #c05a00; font-weight: 600; }
      .banner { text-align: center; font-size: 12px; color: #6b6156; padding: 4px; background: #faf7f2; border-bottom: 1px solid #eee; }
      form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #e4ddd2; background: #fff; }
      input { flex: 1; padding: 10px 12px; border: 1px solid #d8d0c3; border-radius: 8px; font: inherit; }
      button { padding: 10px 18px; border: 0; border-radius: 8px; background: #1c1c1c; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <header>Jamie — Launch Local assistant <a href="/">dashboard</a></header>
    <div class="banner" id="banner">connecting…</div>
    <div id="chat"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Ask about our services, pricing, or book a call…" autocomplete="off" autofocus />
      <button type="submit" id="send">Send</button>
    </form>
    <script type="module" src="/chat.js"></script>
  </body>
</html>
