<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mistral Chat</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f7f4ef;
        color: #1c1c1c;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 12px 16px;
        background: #ff7000;
        color: #fff;
        font-weight: 600;
      }
      #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.45; }
      .user { align-self: flex-end; background: #ff7000; color: #fff; border-bottom-right-radius: 3px; }
      .assistant { align-self: flex-start; background: #fff; border: 1px solid #e4ddd2; border-bottom-left-radius: 3px; }
      .msg.error { align-self: center; background: #fdeaea; border: 1px solid #f2b8b5; color: #86231f; }
      form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #e4ddd2; background: #fff; }
      input { flex: 1; padding: 10px 12px; border: 1px solid #d8d0c3; border-radius: 8px; font: inherit; }
      button {
        padding: 10px 18px; border: 0; border-radius: 8px; background: #1c1c1c; color: #fff;
        font: inherit; font-weight: 600; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <header>Mistral Chat — <span id="model">…</span></header>
    <div id="chat"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Type a message…" autocomplete="off" autofocus />
      <button type="submit" id="send">Send</button>
    </form>

    <script type="module" src="/main.js"></script>
  </body>
</html>
